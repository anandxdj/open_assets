version: '3.8'

services:
  # 🐍 Python Vision Service: Processes OpenCV and Gemini tasks
  openasset-py-backend:
    image: anando1/openasset-py-backend:1.0.0
    container_name: openasset-py-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./py_backend/.env
    environment:
      - PORT=8000
      - REDIS_URL=redis://openpoll-redis:6379
    networks:
      - proxy

  # 🚀 Node.js Backend: Handled by Traefik and serves the Frontend
  openasset-backend:
    image: anando1/openasset-backend:1.0.0
    container_name: openasset-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://openpoll-redis:6379
      - PY_BACKEND_URL=http://openasset-py-backend:8000
      - FRONTEND_URL=https://openassets.anands.dev
    depends_on:
      openasset-py-backend:
        condition: service_started
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Securely handles the router & dynamic sub-domain routing
      - "traefik.http.routers.openasset-backend.rule=Host(`openasset-backend.anands.dev`)"
      - "traefik.http.routers.openasset-backend.entrypoints=web"
      # Point to container port 4000 where our backend listens
      - "traefik.http.services.openasset-backend.loadbalancer.server.port=4000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
